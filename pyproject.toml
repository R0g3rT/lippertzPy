[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lippertzpy"
version = "0.3.0"
description = "Python helpers for the Jifeline partner API and logging"
readme = "readme/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Lippert" }
]
keywords = ["jifeline", "api", "logging", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "liplog>=0.3.0",
    "python-dotenv",
    "requests",
]

[project.urls]
Homepage = "https://github.com/R0g3rT/lippertzPy"
Repository = "https://github.com/R0g3rT/lippertzPy"
Issues = "https://github.com/R0g3rT/lippertzPy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lippertzpy*"]
