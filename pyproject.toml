[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lippertzpy"
version = "0.1.2"
description = "Python helpers for the Jifeline partner API and logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lippertzpy*"]
