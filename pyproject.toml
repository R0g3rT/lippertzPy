[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lippertzpy"
version = "0.1.7"
description = "Python helpers for the Jifeline partner API and logging"
readme = "readme/README.md"
requires-python = ">=3.7"
authors = [
    { name = "Robert Lippert" }
]
keywords = ["jifeline", "api", "logging", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv",
    "requests",
    "certifi",
    "charset-normalizer",
    "idna",
    "urllib3",
]

[project.urls]
Homepage = "https://github.com/R0g3rT/lippertzPy"
Repository = "https://github.com/R0g3rT/lippertzPy"
Issues = "https://github.com/R0g3rT/lippertzPy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lippertzpy*"]
